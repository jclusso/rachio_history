service: rachio_history
image: jarrett/rachio_history

servers:
  web:
    hosts:
      - apps.i.lusso.co

proxy:
  ssl: false
  host: rachio.i.lusso.co

registry:
  server: localhost:5555

env:
  secret:
    - RAILS_MASTER_KEY
  clear:
    RAILS_ENV: production
    RAILS_LOG_TO_STDOUT: true
    APP_HOST: rachio.i.lusso.co
    WEB_CONCURRENCY: 2
    RAILS_MAX_THREADS: 5

    # Single SQLite-backed server: run the Solid Queue supervisor inside Puma so the
    # recurring tasks in config/recurring.yml (hourly SyncAccountJob) actually run.
    SOLID_QUEUE_IN_PUMA: true

volumes:
  - rachio_history_storage:/rails/storage

asset_path: /rails/public/assets

builder:
  arch: amd64
  remote: ssh://root@apps.i.lusso.co

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
